<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financiamiento en Cuotas - DBS / ENEE</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#003366; --azul-med:#005599; --azul-claro:#e8f0f8; --acento:#f0a500;
  --bg:#f0f3f8; --blanco:#fff; --gris1:#dde3ed; --gris2:#8899aa; --texto:#1a2a3a;
  --raya:#c8d4e4; --rojo:#cc2233; --verde:#1a7a44; --naranja:#c05000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--texto);font-size:14px}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#002244,#005599);
  display:flex;align-items:center;justify-content:center;z-index:9000}
.login-box{background:#fff;padding:34px 30px;border-radius:14px;width:340px;
  box-shadow:0 12px 50px rgba(0,0,0,.35);text-align:center}
.login-logo{width:60px;height:60px;border-radius:50%;background:var(--acento);color:var(--azul);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.login-box h2{color:var(--azul);font-size:23px;letter-spacing:.5px;text-transform:uppercase}
.login-box p{color:var(--gris2);font-size:12.5px;margin-bottom:20px}
.login-box select,.login-box input{width:100%;padding:10px 12px;margin-bottom:11px;
  border:1px solid var(--gris1);border-radius:7px;font-family:'Barlow',sans-serif;font-size:14px;background:#fbfcfe}
.login-box button{width:100%;padding:11px;background:var(--azul);color:#fff;border:0;
  border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer}
.login-box button:hover{background:var(--azul-med)}
#login-err{color:var(--rojo);font-size:12.5px;min-height:17px;margin-bottom:6px}

/* ---------- HEADER ---------- */
#app{display:none}
header{background:var(--azul);color:#fff;padding:11px 20px;display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 12px rgba(0,30,80,.2)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--acento);color:var(--azul);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
header h1{font-size:20px;letter-spacing:.8px;text-transform:uppercase;line-height:1.1}
header .sub{font-size:11.5px;color:#9fc4e8;letter-spacing:.4px}
.user-pill{margin-left:auto;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);
  padding:6px 12px;border-radius:20px}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--acento);color:var(--azul);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.user-pill .nm{font-size:13px;font-weight:500}
.user-pill .rl{font-size:10.5px;color:#9fc4e8;text-transform:uppercase;letter-spacing:.5px}
.btn-salir{background:rgba(255,255,255,.15);border:0;color:#fff;padding:5px 11px;border-radius:14px;
  font-size:11.5px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:.6px}
.btn-salir:hover{background:var(--rojo)}

/* ---------- TABS ---------- */
.tabs-bar{background:#fff;border-bottom:1px solid var(--gris1);padding:0 18px;display:flex;gap:3px;overflow-x:auto}
.tab-btn{background:transparent;border:0;border-bottom:3px solid transparent;padding:11px 17px;
  font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.6px;text-transform:uppercase;
  color:var(--gris2);cursor:pointer;white-space:nowrap}
.tab-btn:hover{color:var(--azul);background:var(--azul-claro)}
.tab-btn.active{color:#fff;border-radius:6px 6px 0 0}
.tab-btn[data-v="Registro"].active{background:#003366}
.tab-btn[data-v="Empleado"].active{background:#1a6b3a}
.tab-btn[data-v="Planilla"].active{background:#7a3a00}

/* ---------- TOOLBAR ---------- */
.toolbar{padding:13px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.toolbar input[type=text],.toolbar select,.toolbar input[type=month]{
  padding:8px 11px;border:1px solid var(--gris1);border-radius:7px;font-family:'Barlow',sans-serif;
  font-size:13.5px;background:#fff}
.toolbar input[type=text]{min-width:230px;flex:1}
.btn{padding:8px 15px;border:0;border-radius:7px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.7px;text-transform:uppercase}
.btn-nuevo{background:var(--acento);color:var(--azul);font-weight:700}
.btn-nuevo:hover{background:#d99400}
.btn-sec{background:#fff;color:var(--azul);border:1px solid var(--raya)}
.btn-sec:hover{background:var(--azul-claro)}
.btn-ok{background:var(--verde);color:#fff}
.btn-del{background:var(--rojo);color:#fff}
.corte-box{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--raya);
  border-radius:7px;padding:4px 10px}
.corte-box label{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--gris2)}
.corte-box input{border:0;background:transparent;font-family:'Barlow',sans-serif;font-size:13.5px}

/* ---------- KPIs ---------- */
.kpis{padding:0 18px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.kpi{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 2px 12px rgba(0,30,80,.07);
  border-left:4px solid var(--azul)}
.kpi.v{border-left-color:var(--verde)} .kpi.a{border-left-color:var(--acento)}
.kpi.r{border-left-color:var(--rojo)} .kpi.n{border-left-color:var(--naranja)}
.kpi .lab{font-family:'Barlow Condensed',sans-serif;font-size:11.5px;letter-spacing:.8px;
  text-transform:uppercase;color:var(--gris2)}
.kpi .val{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;color:var(--azul);line-height:1.15}
.kpi .val.sm{font-size:20px}

/* ---------- TABLA ---------- */
.tabla-wrap{padding:0 18px 26px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;
  box-shadow:0 2px 16px rgba(0,30,80,.08)}
thead tr{background:var(--azul);color:#fff}
thead th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.6px;
  text-transform:uppercase;padding:10px 11px;white-space:nowrap;cursor:pointer;text-align:left}
thead th:hover{background:var(--azul-med)}
tbody tr:nth-child(even){background:var(--azul-claro)}
tbody tr:hover{background:#d0e4f7 !important}
tbody tr.nueva{background:#fff8e6 !important}
td{padding:7px 11px;vertical-align:middle;border-right:1px solid var(--raya);font-size:13.5px}
td:last-child{border-right:0}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vacio{text-align:center;padding:36px;color:var(--gris2);font-size:15px}

.badge{display:inline-block;padding:2px 9px;border-radius:11px;font-family:'Barlow Condensed',sans-serif;
  font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:600;white-space:nowrap}
.b-act{background:#dff0e8;color:#1a7a44}
.b-liq{background:#e0e6ee;color:#5a6a7a}
.b-sus{background:#fde8d8;color:#c05000}
.b-mora{background:#fde0e0;color:#b02020}

.prog{width:74px;height:7px;background:var(--gris1);border-radius:4px;overflow:hidden;display:inline-block;
  vertical-align:middle;margin-right:6px}
.prog i{display:block;height:100%;background:var(--verde)}
.prog i.p{background:var(--acento)}

.icon-btn{background:transparent;border:0;cursor:pointer;font-size:14.5px;padding:2px 4px;border-radius:4px;opacity:.75}
.icon-btn:hover{opacity:1;background:rgba(0,51,102,.09)}

/* ---------- MODAL ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(0,20,50,.55);z-index:8000;
  align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:13px;width:100%;max-width:660px;box-shadow:0 16px 60px rgba(0,0,0,.3)}
.modal-box.wide{max-width:820px}
.modal-head{background:var(--azul);color:#fff;padding:13px 20px;border-radius:13px 13px 0 0;
  display:flex;align-items:center;gap:11px}
.modal-head h3{font-size:18px;letter-spacing:.7px;text-transform:uppercase}
.modal-head .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.modal-body{padding:19px 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.f label{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;letter-spacing:.7px;
  text-transform:uppercase;color:var(--gris2)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--gris1);border-radius:7px;
  font-family:'Barlow',sans-serif;font-size:14px;background:#fbfcfe}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--azul-med);background:#fff}
.f textarea{resize:vertical;min-height:56px}
.modal-foot{padding:13px 20px;border-top:1px solid var(--gris1);display:flex;gap:9px;justify-content:flex-end}
.calc-box{background:var(--azul-claro);border:1px solid var(--raya);border-radius:9px;padding:11px 14px;
  margin-bottom:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.calc-box div span{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;
  letter-spacing:.7px;text-transform:uppercase;color:var(--gris2)}
.calc-box div b{font-family:'Barlow Condensed',sans-serif;font-size:19px;color:var(--azul)}

.plan-tab{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.plan-tab th{background:var(--azul);color:#fff;padding:7px 9px;font-family:'Barlow Condensed',sans-serif;
  font-size:12px;letter-spacing:.5px;text-transform:uppercase;text-align:left}
.plan-tab td{padding:6px 9px;border-bottom:1px solid var(--gris1)}
.plan-tab tr.pag{background:#f2faf5}
.plan-tab tr.act{background:#fff8e6;font-weight:600}

/* ---------- MISC ---------- */
#loading{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:9500;
  align-items:center;justify-content:center}
#loading.on{display:flex}
.spin{width:44px;height:44px;border:4px solid var(--gris1);border-top-color:var(--azul);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;right:22px;background:var(--azul);color:#fff;padding:12px 19px;
  border-radius:9px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);opacity:0;
  transform:translateY(14px);transition:.25s;z-index:9600;pointer-events:none;max-width:330px}
#toast.on{opacity:1;transform:translateY(0)}
#toast.err{background:var(--rojo)} #toast.ok{background:var(--verde)}
.info-bar{padding:0 18px 9px;font-size:12.5px;color:var(--gris2);display:flex;gap:15px;flex-wrap:wrap}
.info-bar b{color:var(--azul)}
@media print{
  header,.tabs-bar,.toolbar,.info-bar,.icon-btn,#toast{display:none !important}
  body{background:#fff}
  .tabla-wrap{padding:0}
}
@media(max-width:700px){
  .grid2,.grid3{grid-template-columns:1fr}
  header h1{font-size:16px}
  .user-pill .nm,.user-pill .rl{display:none}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">ENEE</div>
    <h2>Financiamiento</h2>
    <p>Registro de cuotas &mdash; DBS / DDH</p>
    <select id="lg-user"><option value="">Seleccione usuario...</option></select>
    <input type="password" id="lg-pass" placeholder="Contrase&ntilde;a" onkeydown="if(event.key==='Enter')entrar()">
    <div id="login-err"></div>
    <button onclick="entrar()">Ingresar</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="logo">ENEE</div>
    <div>
      <h1>Financiamiento en Cuotas</h1>
      <div class="sub">Departamento de Bienestar Social &mdash; Direcci&oacute;n de Desarrollo Humano</div>
    </div>
    <div class="user-pill">
      <div class="avatar" id="u-ini">--</div>
      <div><div class="nm" id="u-nom">--</div><div class="rl" id="u-rol">--</div></div>
      <button class="btn-salir" onclick="salir()">Salir</button>
    </div>
  </header>

  <div class="tabs-bar">
    <button class="tab-btn active" data-v="Registro"  onclick="setVista('Registro')">&#x1F4CB; Financiamientos</button>
    <button class="tab-btn"        data-v="Empleado"  onclick="setVista('Empleado')">&#x1F464; Conteo por Empleado</button>
    <button class="tab-btn"        data-v="Planilla"  onclick="setVista('Planilla')">&#x1F4B0; Descuento del Mes</button>
  </div>

  <div class="toolbar">
    <input type="text" id="buscar" placeholder="Buscar clave, empleado, factura, proveedor..." oninput="render()">
    <select id="f-estado" onchange="render()">
      <option value="">Todos los estados</option>
      <option value="Activo">Activo</option>
      <option value="Liquidado">Liquidado</option>
      <option value="Suspendido">Suspendido</option>
    </select>
    <select id="f-anio" onchange="render()"><option value="">Todos los a&ntilde;os</option></select>
    <div class="corte-box">
      <label>Mes de corte</label>
      <input type="month" id="corte" onchange="render()">
    </div>
    <button class="btn btn-nuevo" onclick="abrirModal()">+ Nuevo</button>
    <button class="btn btn-sec" onclick="exportar()">&#x2B07; CSV</button>
    <button class="btn btn-sec" onclick="window.print()">&#x1F5A8; Imprimir</button>
    <button class="btn btn-sec" id="btn-usuarios" style="display:none" onclick="abrirUsuarios()">&#x1F465; Usuarios</button>
    <button class="btn btn-sec" onclick="diagnostico()">&#x1F527; Diagn&oacute;stico</button>
    <button class="btn btn-sec" onclick="cargarDatos(false)">&#x21BB; Recargar</button>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="info-bar" id="info"></div>
  <div class="tabla-wrap" id="tabla-wrap"></div>
</div>

<!-- ============ MODAL REGISTRO ============ -->
<div class="modal" id="modal-doc">
  <div class="modal-box">
    <div class="modal-head"><h3 id="md-titulo">Nuevo Financiamiento</h3>
      <button class="x" onclick="cerrar('modal-doc')">&times;</button></div>
    <div class="modal-body">
      <div class="grid3">
        <div class="f"><label>No. Registro</label><input type="text" id="m-no"></div>
        <div class="f"><label>Clave del empleado</label>
          <input type="text" id="m-clave" list="dl-clave" autocomplete="off" oninput="onClaveInput()" placeholder="Escriba la clave...">
          <datalist id="dl-clave"></datalist></div>
        <div class="f"><label>Estado</label>
          <select id="m-estado">
            <option value="Activo">Activo</option>
            <option value="Suspendido">Suspendido</option>
            <option value="Liquidado">Liquidado</option>
          </select></div>
      </div>
      <div class="grid2">
        <div class="f"><label>Nombre del empleado</label>
          <input type="text" id="m-nombre" list="dl-nombre" autocomplete="off" oninput="onNombreInput()" placeholder="O escriba el nombre...">
          <datalist id="dl-nombre"></datalist></div>
        <div class="f"><label>Centro de trabajo</label><input type="text" id="m-centro"></div>
      </div>
      <div class="grid3">
        <div class="f"><label>No. de factura</label><input type="text" id="m-factura"></div>
        <div class="f"><label>Proveedor</label><input type="text" id="m-proveedor"></div>
        <div class="f"><label>Fecha de factura</label><input type="date" id="m-fecha" onchange="sugerirInicio()"></div>
      </div>
      <div class="grid3">
        <div class="f"><label>Monto total (L)</label>
          <input type="number" id="m-monto" step="0.01" min="0" oninput="previewCalc()"></div>
        <div class="f"><label>No. de cuotas</label>
          <select id="m-cuotas" onchange="previewCalc()"></select></div>
        <div class="f"><label>Inicio de descuento</label>
          <input type="month" id="m-inicio" onchange="previewCalc()"></div>
      </div>
      <div class="calc-box" id="calc-box"></div>
      <div class="f"><label>Abono extraordinario (L) &mdash; opcional</label>
        <input type="number" id="m-abono" step="0.01" min="0" value="0" oninput="previewCalc()"></div>
      <div class="f"><label>Observaciones</label><textarea id="m-obs"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-sec" onclick="cerrar('modal-doc')">Cancelar</button>
      <button class="btn btn-ok" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- ============ MODAL PLAN ============ -->
<div class="modal" id="modal-plan">
  <div class="modal-box wide">
    <div class="modal-head"><h3>Plan de Cuotas</h3>
      <button class="x" onclick="cerrar('modal-plan')">&times;</button></div>
    <div class="modal-body" id="plan-body"></div>
    <div class="modal-foot"><button class="btn btn-sec" onclick="cerrar('modal-plan')">Cerrar</button></div>
  </div>
</div>

<!-- ============ MODAL USUARIOS ============ -->
<div class="modal" id="modal-usu">
  <div class="modal-box wide">
    <div class="modal-head"><h3>Gesti&oacute;n de Usuarios</h3>
      <button class="x" onclick="cerrar('modal-usu')">&times;</button></div>
    <div class="modal-body">
      <div style="background:var(--azul-claro);border:1px solid var(--raya);border-radius:9px;padding:13px 15px;margin-bottom:15px">
        <div class="cond" style="font-size:15px;letter-spacing:.6px;text-transform:uppercase;color:var(--azul);margin-bottom:9px"
             id="usu-form-titulo">Agregar nuevo usuario</div>
        <div class="grid3">
          <div class="f"><label>Usuario (login)</label><input type="text" id="u-id" placeholder="ej. gustavo"></div>
          <div class="f"><label>Nombre completo</label><input type="text" id="u-nombre" placeholder="ej. Gustavo D."></div>
          <div class="f"><label>Contrase&ntilde;a</label><input type="text" id="u-pass" placeholder="ej. gustavo2026"></div>
        </div>
        <div class="grid2">
          <div class="f"><label>Rol</label>
            <select id="u-rolsel">
              <option value="usuario">Usuario (consulta y registro)</option>
              <option value="admin">Administrador (puede eliminar y gestionar usuarios)</option>
            </select></div>
          <div class="f" style="justify-content:flex-end">
            <div style="display:flex;gap:8px">
              <button class="btn btn-ok" style="flex:1" onclick="guardarUsuario()" id="u-btn-guardar">Agregar usuario</button>
              <button class="btn btn-sec" onclick="limpiarFormUsuario()">Limpiar</button>
            </div>
          </div>
        </div>
      </div>
      <div id="usu-lista"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-sec" onclick="cerrar('modal-usu')">Cerrar</button></div>
  </div>
</div>

<div id="loading"><div class="spin"></div></div>
<div id="toast"></div>

<script>
/* ==================================================================
   CONFIGURACION
================================================================== */
var API   = 'https://script.google.com/macros/s/AKfycbwYFUtGUs-EBDrBl8Qny-R-NFYlfD79XfmhyB1MRoRkxT2PUJlZauE8_rFo1vOGWEn-SQ/exec';
var HOJA  = 'Financiamiento';
var HOJA_USU = 'UsuariosFin';   // hoja propia: NO tocar la hoja 'Usuarios' compartida
var HOJA_EMP = 'EMPLEADOS';     // catalogo de empleados (solo lectura)
/* Si la deteccion automatica de columnas falla, fije aqui los numeros de
   columna (0 = A, 1 = B, 2 = C ...). Ejemplo: {clave:0, nombre:1, centro:2} */
var EMP_COLS = {clave:null, nombre:null, centro:null};
var EMPLEADOS = [];
var EMP_MAPA  = {};
var LSKEY = 'enee_financiamiento_v1';

/* Usuario base del sistema. Los demas se administran desde el boton
   "Usuarios" (solo admin) y se guardan en la hoja "Usuarios". */
var USUARIOS_DEFAULT = [
  {id:'admin', nombre:'Administrador', pass:'admin2026', rol:'admin', protegido:true}
];
var USAR_USUARIOS_SHEETS = true;

var USUARIOS = USUARIOS_DEFAULT.slice();
var usuarioActual = null;
var DATOS = [];
var vistaActual = 'Registro';
var editandoFila = null;
var ordenCol = null, ordenAsc = true;
var reloadTimer = null;

var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ==================================================================
   UTILIDADES
================================================================== */
function num(v){ var n = parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function L(n){ return 'L ' + (num(n)).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function limpiarFecha(v){
  if(!v) return '';
  var s = String(v);
  if(s.indexOf('T')!==-1){
    var d = new Date(s);
    if(!isNaN(d)){
      var dd=String(d.getUTCDate()).padStart(2,'0');
      var mm=String(d.getUTCMonth()+1).padStart(2,'0');
      return dd+'/'+mm+'/'+d.getUTCFullYear();
    }
  }
  return s;
}
/* Normaliza cualquier cosa a 'YYYY-MM' */
function mesNorm(v){
  if(!v) return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{4})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(parseInt(m[2],10)).padStart(2,'0');
  if(s.indexOf('T')!==-1){
    var d = new Date(s);
    if(!isNaN(d)) return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
  }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ var y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+String(parseInt(m[2],10)).padStart(2,'0'); }
  return '';
}
function ymIdx(ym){ var m=String(ym||'').match(/^(\d{4})-(\d{2})$/); return m? (parseInt(m[1],10)*12+parseInt(m[2],10)-1) : null; }
function idxYm(i){ var y=Math.floor(i/12), m=i%12+1; return y+'-'+String(m).padStart(2,'0'); }
function ymLabel(ym){ var i=ymIdx(ym); if(i===null) return '-'; return MESES[i%12].substring(0,3)+' '+Math.floor(i/12); }
function hoyYm(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function corteYm(){ return document.getElementById('corte').value || hoyYm(); }

function toast(msg,tipo){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='on'+(tipo?' '+tipo:'');
  clearTimeout(t._t); t._t=setTimeout(function(){t.className='';},3200);
}
function cargando(on){ document.getElementById('loading').className = on?'on':''; }
function cerrar(id){ document.getElementById(id).className='modal'; }

/* ==================================================================
   API  (JSONP para leer / POST para escribir)
================================================================== */
var jsonpN = 0;
function apiGet(tipo, cb){
  var fn = 'cb_'+(++jsonpN)+'_'+Date.now();
  var s  = document.createElement('script');
  var listo = false;
  window[fn] = function(r){ listo=true; try{cb(r);}catch(e){console.error(e);} limpiar(); };
  function limpiar(){ try{delete window[fn];}catch(e){window[fn]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); }
  s.onerror = function(){ if(!listo){ cb(null); limpiar(); } };
  s.src = API+'?accion=leer&tipo='+encodeURIComponent(tipo)+'&callback='+fn+'&_='+Date.now();
  document.body.appendChild(s);
  setTimeout(function(){ if(!listo){ cb(null); limpiar(); } }, 20000);
}
var ULTIMA_RESPUESTA = '(sin datos)';
function apiPost(payload, cb){
  ULTIMA_RESPUESTA = '(esperando...)';
  fetch(API, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(r){ return r.text(); })
    .then(function(t){
      ULTIMA_RESPUESTA = t;
      console.log('Respuesta del servidor:', t);
      var j = null; try{ j = JSON.parse(t); }catch(e){}
      var ok = true, msg = '';
      if(j){
        if(j.ok===false || j.error || j.success===false || j.status==='error'){
          ok = false;
          msg = j.error || j.mensaje || j.message || 'El servidor rechazo la operacion';
        }
      }else{
        if(/error|exception|no se encontr|not found|autoriza/i.test(t)){
          ok = false; msg = String(t).replace(/<[^>]*>/g,' ').substring(0,180);
        }
      }
      cb(ok, j, msg);
    })
    .catch(function(e){
      ULTIMA_RESPUESTA = 'ERROR DE RED: '+e;
      console.error(e);
      cb(false, null, 'No hay conexion con el servidor');
    });
}

/* ==================================================================
   MAPEO DE COLUMNAS  (hoja "Financiamiento")
   0 no | 1 clave | 2 nombre | 3 centro | 4 factura | 5 proveedor
   6 fechaFactura | 7 monto | 8 cuotas | 9 mesInicio | 10 abono
   11 estado | 12 obs | 13 anio | 14 registradoPor
================================================================== */
function filaAObj(f, i){
  return {
    fila: i+2,
    no:            String(f[0]==null?'':f[0]),
    clave:         String(f[1]==null?'':f[1]).trim(),
    nombre:        String(f[2]==null?'':f[2]).trim(),
    centro:        String(f[3]==null?'':f[3]).trim(),
    factura:       String(f[4]==null?'':f[4]).trim(),
    proveedor:     String(f[5]==null?'':f[5]).trim(),
    fechaFactura:  limpiarFecha(f[6]),
    monto:         num(f[7]),
    cuotas:        Math.max(1, parseInt(f[8],10)||6),
    mesInicio:     mesNorm(f[9]),
    abono:         num(f[10]),
    estado:        String(f[11]||'Activo').trim() || 'Activo',
    obs:           String(f[12]==null?'':f[12]),
    anio:          String(f[13]==null?'':f[13]).trim(),
    registradoPor: String(f[14]==null?'':f[14])
  };
}
function objACols(d){
  return [d.no, d.clave, d.nombre, d.centro, d.factura, d.proveedor, d.fechaFactura,
          d.monto, d.cuotas, d.mesInicio, d.abono, d.estado, d.obs, d.anio, d.registradoPor];
}

/* ==================================================================
   MOTOR DE CALCULO  -- las cuotas bajan solas segun el mes
================================================================== */
function calc(d, corte){
  var n     = d.cuotas;
  var base  = n>0 ? Math.round((d.monto/n)*100)/100 : 0;   // cuota mensual
  var ultima= Math.round((d.monto - base*(n-1))*100)/100;  // ajuste de redondeo
  var ini   = ymIdx(d.mesInicio);
  var cor   = ymIdx(corte);

  var porTiempo = 0;
  if(ini!==null && cor!==null) porTiempo = cor - ini + 1;   // el mes de inicio ya cuenta 1
  if(porTiempo<0) porTiempo = 0;

  var porAbono = base>0 ? Math.floor((d.abono+0.005)/base) : 0;

  var pagadas = porTiempo + porAbono;
  if(d.estado==='Liquidado') pagadas = n;
  if(pagadas>n) pagadas = n;
  if(pagadas<0) pagadas = 0;

  var pend  = n - pagadas;
  var abon  = 0;
  for(var k=1;k<=pagadas;k++) abon += (k===n?ultima:base);
  abon  = Math.round(abon*100)/100;
  var saldo = Math.round((d.monto - abon)*100)/100;
  if(saldo<0) saldo = 0;

  var fin = (ini!==null) ? idxYm(ini+n-1) : '';
  // cuota que corresponde descontar en el mes de corte
  var cuotaMes = 0, nroCuotaMes = 0;
  if(ini!==null && cor!==null && cor>=ini && cor<=ini+n-1 && d.estado==='Activo' && pend>0){
    nroCuotaMes = cor - ini + 1;
    cuotaMes = (nroCuotaMes===n?ultima:base);
  }
  var estadoCalc = d.estado;
  if(d.estado==='Activo' && pend===0) estadoCalc = 'Liquidado';

  return {base:base, ultima:ultima, pagadas:pagadas, pend:pend, abonado:abon,
          saldo:saldo, fin:fin, cuotaMes:cuotaMes, nroCuotaMes:nroCuotaMes, estadoCalc:estadoCalc};
}

        lista.push({id:String(f[0]).trim().toLowerCase(),
                    nombre:String(f[1]||f[0]).trim(),

  if(!silencioso) cargando(true);
  apiGet(HOJA, function(r){

    if(r && r.datos){
      DATOS = [];

/* ==================================================================
   CATALOGO DE EMPLEADOS  (hoja EMPLEADOS, solo lectura)
================================================================== */
function detectarColumnasEmp(filas){
  if(EMP_COLS.clave!==null && EMP_COLS.nombre!==null) return EMP_COLS;
  var muestra = filas.slice(0, 250);
  var nCols = 0;
  for(var i=0;i<muestra.length;i++) if(muestra[i].length>nCols) nCols = muestra[i].length;

  var stats = [];
  for(var c=0;c<nCols;c++){
    var llenos=0, numericos=0, largo=0, palabras=0, distintos={};
    for(var r=0;r<muestra.length;r++){
      var v = String(muestra[r][c]==null?'':muestra[r][c]).trim();
      if(!v) continue;
      llenos++;
      largo += v.length;
      palabras += v.split(/\s+/).length;
      distintos[v.toLowerCase()] = 1;
      if(/^[0-9\-\.]+$/.test(v)) numericos++;
    }
    stats.push({
      col:c, llenos:llenos,
      fracNum: llenos? numericos/llenos : 0,
      largoProm: llenos? largo/llenos : 0,
      palProm: llenos? palabras/llenos : 0,
      distintos: Object.keys(distintos).length
    });
  }
  var utiles = stats.filter(function(s){ return s.llenos > muestra.length*0.4; });
  if(!utiles.length) return EMP_COLS;

  // Clave: la columna mas numerica y corta
  var clave = utiles.slice().sort(function(a,b){
    if(b.fracNum !== a.fracNum) return b.fracNum - a.fracNum;
    return a.largoProm - b.largoProm;
  })[0];

  // Nombre: texto con mas palabras por celda y muchos valores distintos
  var texto = utiles.filter(function(s){ return s.col!==clave.col && s.fracNum<0.5; });
  var nombre = texto.slice().sort(function(a,b){
    var pa = a.palProm*1.5 + (a.distintos/muestra.length)*2;
    var pb = b.palProm*1.5 + (b.distintos/muestra.length)*2;
    return pb - pa;
  })[0];

  // Centro: el otro texto, con menos valores distintos (se repite mucho)
  var centro = texto.filter(function(s){ return !nombre || s.col!==nombre.col; })
                    .sort(function(a,b){ return a.distintos - b.distintos; })[0];

  EMP_COLS = {
    clave:  clave  ? clave.col  : 0,
    nombre: nombre ? nombre.col : 1,
    centro: centro ? centro.col : null
  };
  console.log('Columnas EMPLEADOS detectadas:', EMP_COLS);
  return EMP_COLS;
}

function cargarEmpleados(){
  apiGet(HOJA_EMP, function(r){
    if(!r || !r.datos || !r.datos.length){
      console.warn('No se pudo leer la hoja '+HOJA_EMP);
      actualizarInfoEmp(0);
      return;
    }
    var filas = r.datos.filter(function(f){
      return f && f.join('').trim() !== '';
    });
    var col = detectarColumnasEmp(filas);
    EMPLEADOS = []; EMP_MAPA = {};
    for(var i=0;i<filas.length;i++){
      var f = filas[i];
      var cl = String(f[col.clave]==null?'':f[col.clave]).trim();
      var nb = String(f[col.nombre]==null?'':f[col.nombre]).trim();
      var ce = col.centro!==null ? String(f[col.centro]==null?'':f[col.centro]).trim() : '';
      if(!cl && !nb) continue;
      var e = {clave:cl, nombre:nb, centro:ce};
      EMPLEADOS.push(e);
      if(cl) EMP_MAPA[cl.toLowerCase()] = e;
    }
    actualizarInfoEmp(EMPLEADOS.length);
  });
}
function actualizarInfoEmp(n){
  var el = document.getElementById('info-emp');
  if(el) el.innerHTML = n
    ? 'Cat&aacute;logo: <b>'+n+'</b> empleados'
    : '<span style="color:#c05000">Cat&aacute;logo de empleados no disponible</span>';
}

/* Busca coincidencias por clave o por nombre */
function buscarEmpleados(q, porNombre){
  q = String(q||'').toLowerCase().trim();
  if(q.length < 2) return [];
  var out = [];
  for(var i=0;i<EMPLEADOS.length && out.length<30;i++){
    var e = EMPLEADOS[i];
    var campo = porNombre ? e.nombre : e.clave;
    if(String(campo).toLowerCase().indexOf(q) !== -1) out.push(e);
  }
  return out;
}
function pintarSugerencias(idLista, lista, porNombre){
  var dl = document.getElementById(idLista);
  if(!dl) return;
  var h = '';
  for(var i=0;i<lista.length;i++){
    var e = lista[i];
    var val = porNombre ? e.nombre : e.clave;
    var etq = porNombre ? (e.clave+(e.centro?' - '+e.centro:'')) : e.nombre;
    h += '<option value="'+esc(val)+'">'+esc(etq)+'</option>';
  }
  dl.innerHTML = h;
}
function aplicarEmpleado(e){
  if(!e) return;
  if(e.clave)  document.getElementById('m-clave').value  = e.clave;
  if(e.nombre) document.getElementById('m-nombre').value = e.nombre;
  if(e.centro) document.getElementById('m-centro').value = e.centro;
}
function onClaveInput(){
  var v = document.getElementById('m-clave').value;
  pintarSugerencias('dl-clave', buscarEmpleados(v,false), false);
  var e = EMP_MAPA[String(v).toLowerCase().trim()];
  if(e) aplicarEmpleado(e);
}
function onNombreInput(){
  var v = document.getElementById('m-nombre').value;
  var lista = buscarEmpleados(v,true);
  pintarSugerencias('dl-nombre', lista, true);
  for(var i=0;i<lista.length;i++){
    if(lista[i].nombre.toLowerCase() === String(v).toLowerCase().trim()){
      aplicarEmpleado(lista[i]); break;
    }
  }
}

   FILTROS
================================================================== */
function poblarAnios(){
  var sel = document.getElementById('f-anio');
  var prev = sel.value, set = {}, a = String(new Date().getFullYear());
  for(var i=0;i<DATOS.length;i++){
    var y = DATOS[i].anio || (DATOS[i].mesInicio? DATOS[i].mesInicio.substring(0,4) : a);
    if(y) set[y]=1;
  }
  var arr = Object.keys(set).sort().reverse();
  sel.innerHTML = '<option value="">Todos los a&ntilde;os</option>';
  for(var j=0;j<arr.length;j++) sel.innerHTML += '<option value="'+arr[j]+'">'+arr[j]+'</option>';
  sel.value = prev;
}
function filtrar(){
  var q      = document.getElementById('buscar').value.toLowerCase().trim();
  var est    = document.getElementById('f-estado').value;
  var anioF  = document.getElementById('f-anio').value;
  var anioAct= String(new Date().getFullYear());
  var corte  = corteYm();
  var out    = [];
  for(var i=0;i<DATOS.length;i++){
    var d = DATOS[i];
    var c = calc(d, corte);
    var txt = (d.no+' '+d.clave+' '+d.nombre+' '+d.centro+' '+d.factura+' '+d.proveedor+' '+d.obs).toLowerCase();
    var dAnio = d.anio || (d.mesInicio? d.mesInicio.substring(0,4) : anioAct);
    if( (!q || txt.indexOf(q)!==-1) &&
        (!est || c.estadoCalc===est) &&
        (!anioF || dAnio===anioF) ){
      d._c = c; out.push(d);
    }
  }
  if(ordenCol){
    out.sort(function(a,b){
      var x = a[ordenCol]!==undefined ? a[ordenCol] : a._c[ordenCol];
      var y = b[ordenCol]!==undefined ? b[ordenCol] : b._c[ordenCol];
      if(typeof x==='number' && typeof y==='number') return ordenAsc? x-y : y-x;
      x=String(x).toLowerCase(); y=String(y).toLowerCase();
      return ordenAsc ? (x<y?-1:x>y?1:0) : (x>y?-1:x<y?1:0);
    });
  }
  return out;
}
function ordenar(col){
  if(ordenCol===col) ordenAsc = !ordenAsc; else { ordenCol=col; ordenAsc=true; }
  render();
}

function setVista(v){
  vistaActual = v;
  var b = document.querySelectorAll('.tab-btn');
  for(var i=0;i<b.length;i++) b[i].className = 'tab-btn'+(b[i].getAttribute('data-v')===v?' active':'');

function render(){
  var lista = filtrar();
  var corte = corteYm();
  pintarKpis(lista, corte);
  document.getElementById('info').innerHTML =
    'Mes de corte: <b>'+ymLabel(corte)+'</b> &nbsp;&bull;&nbsp; Registros mostrados: <b>'+lista.length+
    '</b> de <b>'+DATOS.length+'</b> &nbsp;&bull;&nbsp; Usuario: <b>'+esc(usuarioActual?usuarioActual.nombre:'')+'</b>'+
    ' &nbsp;&bull;&nbsp; <span id="info-emp">'+(EMPLEADOS.length? 'Cat&aacute;logo: <b>'+EMPLEADOS.length+'</b> empleados':'')+'</span>';

  if(vistaActual==='Registro')      pintarRegistro(lista, corte);
  else if(vistaActual==='Empleado') pintarEmpleado(lista, corte);
  else                              pintarPlanilla(lista, corte);
}

function pintarKpis(lista, corte){
  var act=0, liq=0, emp={}, total=0, saldo=0, mes=0, cuotasMes=0;
  for(var i=0;i<lista.length;i++){
    var d=lista[i], c=d._c;
    total += d.monto; saldo += c.saldo;
    if(c.estadoCalc==='Activo'){ act++; emp[d.clave||d.nombre]=1; }
    if(c.estadoCalc==='Liquidado') liq++;
    if(c.cuotaMes>0){ mes += c.cuotaMes; cuotasMes++; }
  }
  document.getElementById('kpis').innerHTML =
    kpi('Financiamientos activos', act, '') +
    kpi('Empleados con saldo', Object.keys(emp).length, 'v') +
    kpi('Monto total financiado', L(total), 'a', true) +
    kpi('Saldo pendiente', L(saldo), 'r', true) +
    kpi('Descuento de '+ymLabel(corte), L(mes), 'n', true) +
    kpi('Cuotas a descontar', cuotasMes, '');
}
function kpi(lab,val,cls,sm){
  return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="lab">'+lab+'</div>'+
         '<div class="val'+(sm?' sm':'')+'">'+val+'</div></div>';
}

/* ---------- VISTA 1: detalle de financiamientos ---------- */
function pintarRegistro(lista, corte){
  var h = '<table><thead><tr>'+

function th(lab,col){ return '<th onclick="ordenar(\''+col+'\')">'+lab+'</th>'; }
function badge(e){
  var m = {'Activo':'b-act','Liquidado':'b-liq','Suspendido':'b-sus'};
  return '<span class="badge '+(m[e]||'b-liq')+'">'+esc(e)+'</span>';
}

/* ---------- VISTA 2: conteo por empleado ---------- */
function pintarEmpleado(lista, corte){
  var mapa = {};
  for(var i=0;i<lista.length;i++){
    var d=lista[i], c=d._c;
    var k = d.clave || d.nombre || '(sin clave)';
    if(!mapa[k]) mapa[k] = {clave:d.clave, nombre:d.nombre, centro:d.centro,
                            n:0, activos:0, total:0, abonado:0, saldo:0, cuotaMes:0,
                            cuotasPend:0, ultFin:''};
    var e = mapa[k];
    e.n++; e.total += d.monto; e.abonado += c.abonado; e.saldo += c.saldo;
    e.cuotaMes += c.cuotaMes; e.cuotasPend += c.pend;
    if(c.estadoCalc==='Activo') e.activos++;
    if(!e.nombre && d.nombre) e.nombre = d.nombre;
    if(!e.centro && d.centro) e.centro = d.centro;
    if(c.fin > e.ultFin) e.ultFin = c.fin;
  }
  var arr = [];
  for(var k2 in mapa) arr.push(mapa[k2]);
  arr.sort(function(a,b){ return b.saldo - a.saldo; });

  var h = '<table><thead><tr>'+
    '<th>Clave</th><th>Empleado</th><th>Centro de trabajo</th>'+
    '<th>Financiam.</th><th>Activos</th><th>Total financiado</th><th>Abonado</th>'+
    '<th>Saldo pendiente</th><th>Cuotas pend.</th><th>Descuento '+ymLabel(corte)+'</th><th>Ultimo mes</th>'+
    '</tr></thead><tbody>';
  if(!arr.length) h += '<tr><td colspan="11" class="vacio">Sin datos.</td></tr>';
  for(var j=0;j<arr.length;j++){
    var e = arr[j];
    h += '<tr>'+
      '<td>'+esc(e.clave)+'</td>'+
      '<td>'+esc(e.nombre)+'</td>'+
      '<td>'+esc(e.centro)+'</td>'+
      '<td class="num"><b>'+e.n+'</b></td>'+
      '<td class="num">'+e.activos+'</td>'+
      '<td class="num">'+L(e.total)+'</td>'+
      '<td class="num">'+L(e.abonado)+'</td>'+
      '<td class="num"><b>'+L(e.saldo)+'</b></td>'+
      '<td class="num">'+e.cuotasPend+'</td>'+
      '<td class="num">'+(e.cuotaMes>0? L(e.cuotaMes) : '-')+'</td>'+
      '<td>'+ymLabel(e.ultFin)+'</td>'+
    '</tr>';
  }
  document.getElementById('tabla-wrap').innerHTML = h+'</tbody></table>';
}

/* ---------- VISTA 3: descuento del mes (para planilla) ---------- */
function pintarPlanilla(lista, corte){
  var filas = [], tot = 0;
  for(var i=0;i<lista.length;i++){
    var d=lista[i], c=d._c;
    if(c.cuotaMes>0){ filas.push({d:d,c:c}); tot += c.cuotaMes; }
  }
  filas.sort(function(a,b){ return (a.d.clave||'').localeCompare(b.d.clave||''); });

  var h = '<table><thead><tr>'+
    '<th>Clave</th><th>Empleado</th><th>Centro</th><th>Factura</th><th>Proveedor</th>'+
    '<th>Cuota No.</th><th>Monto a descontar</th><th>Saldo despues</th>'+
    '</tr></thead><tbody>';
  if(!filas.length){
    h += '<tr><td colspan="8" class="vacio">No hay cuotas a descontar en '+ymLabel(corte)+'.</td></tr>';
  }
  for(var j=0;j<filas.length;j++){
    var d=filas[j].d, c=filas[j].c;
    h += '<tr>'+
      '<td>'+esc(d.clave)+'</td>'+
      '<td>'+esc(d.nombre)+'</td>'+
      '<td>'+esc(d.centro)+'</td>'+
      '<td>'+esc(d.factura)+'</td>'+
      '<td>'+esc(d.proveedor)+'</td>'+
      '<td class="num">'+c.nroCuotaMes+' de '+d.cuotas+'</td>'+
      '<td class="num">'+L(c.cuotaMes)+'</td>'+
      '<td class="num">'+L(c.saldo)+'</td>'+
    '</tr>';
  }
  if(filas.length){
    h += '<tr style="background:#003366;color:#fff;font-weight:600">'+
         '<td colspan="6" style="text-align:right">TOTAL A DESCONTAR EN '+ymLabel(corte).toUpperCase()+'</td>'+
         '<td class="num">'+L(tot)+'</td><td></td></tr>';
  }
  document.getElementById('tabla-wrap').innerHTML = h+'</tbody></table>';
}

/* ==================================================================
   PLAN DE CUOTAS (detalle mes a mes)
================================================================== */
function verPlan(fila){
  var d = null;
  for(var i=0;i<DATOS.length;i++) if(DATOS[i].fila===fila) d = DATOS[i];
  if(!d) return;
  var corte = corteYm(), c = calc(d, corte);
  var ini = ymIdx(d.mesInicio), cor = ymIdx(corte);

  var h = '<div class="calc-box">'+
    '<div><span>Empleado</span><b style="font-size:15px">'+esc(d.nombre||d.clave)+'</b></div>'+
    '<div><span>Monto total</span><b>'+L(d.monto)+'</b></div>'+
    '<div><span>Cuota mensual</span><b>'+L(c.base)+'</b></div>'+
    '<div><span>Pagadas</span><b>'+c.pagadas+' / '+d.cuotas+'</b></div>'+
    '<div><span>Saldo</span><b>'+L(c.saldo)+'</b></div>'+
    '</div>';
  h += '<div style="font-size:13px;color:#8899aa;margin-bottom:8px">Factura '+esc(d.factura)+
       ' &mdash; '+esc(d.proveedor)+' &mdash; Corte: '+ymLabel(corte)+'</div>';
  h += '<table class="plan-tab"><thead><tr><th>Cuota</th><th>Mes</th><th>Monto</th><th>Saldo despues</th><th>Estado</th></tr></thead><tbody>';
  var acum = 0;
  for(var k=1;k<=d.cuotas;k++){
    var m = (ini!==null)? idxYm(ini+k-1) : '';
    var mo = (k===d.cuotas? c.ultima : c.base);
    acum += mo;
    var sal = Math.round((d.monto-acum)*100)/100; if(sal<0) sal=0;
    var pagada = k<=c.pagadas;
    var actual = (ini!==null && cor!==null && (ini+k-1)===cor);
    h += '<tr class="'+(actual?'act':(pagada?'pag':''))+'">'+
      '<td>'+k+'</td><td>'+ymLabel(m)+'</td><td class="num">'+L(mo)+'</td>'+
      '<td class="num">'+L(sal)+'</td>'+
      '<td>'+(pagada?'<span class="badge b-act">Pagada</span>':'<span class="badge b-sus">Pendiente</span>')+
      (actual?' <span class="badge b-mora">Mes actual</span>':'')+'</td></tr>';
  }
  h += '</tbody></table>';
  document.getElementById('plan-body').innerHTML = h;
  document.getElementById('modal-plan').className = 'modal on';
}

   MODAL NUEVO / EDITAR
================================================================== */
function poblarCuotas(){
  var s = document.getElementById('m-cuotas');
  s.innerHTML = '';
  for(var i=1;i<=24;i++) s.innerHTML += '<option value="'+i+'">'+i+(i===1?' cuota':' cuotas')+'</option>';
}
function siguienteNo(){
  var max = 0;
  for(var i=0;i<DATOS.length;i++){
    var n = parseInt(String(DATOS[i].no).replace(/\D/g,''),10);
    if(!isNaN(n) && n>max) max = n;
  }
  return String(max+1);
}
function sugerirInicio(){
  var f = document.getElementById('m-fecha').value;
  if(!f) return;
  var p = f.split('-');
  var idx = parseInt(p[0],10)*12 + parseInt(p[1],10) - 1 + 1; // mes siguiente
  if(!document.getElementById('m-inicio').value) document.getElementById('m-inicio').value = idxYm(idx);
  previewCalc();
}
function previewCalc(){
  var monto  = num(document.getElementById('m-monto').value);
  var cuotas = parseInt(document.getElementById('m-cuotas').value,10)||12;
  var inicio = document.getElementById('m-inicio').value;
  var abono  = num(document.getElementById('m-abono').value);
  var tmp = {monto:monto, cuotas:cuotas, mesInicio:inicio, abono:abono, estado:'Activo'};
  var c = calc(tmp, corteYm());
  document.getElementById('calc-box').innerHTML =
    '<div><span>Cuota mensual</span><b>'+L(c.base)+'</b></div>'+
    '<div><span>Primer descuento</span><b>'+ymLabel(inicio)+'</b></div>'+
    '<div><span>Ultimo descuento</span><b>'+ymLabel(c.fin)+'</b></div>'+
    '<div><span>Pagadas al corte</span><b>'+c.pagadas+' / '+cuotas+'</b></div>'+
    '<div><span>Saldo al corte</span><b>'+L(c.saldo)+'</b></div>';
}
function abrirModal(fila){
  editandoFila = (fila===undefined? null : fila);
  poblarCuotas();
  var d = null;
  if(editandoFila!==null) for(var i=0;i<DATOS.length;i++) if(DATOS[i].fila===editandoFila) d = DATOS[i];

  document.getElementById('md-titulo').textContent = d? 'Editar Financiamiento' : 'Nuevo Financiamiento';
  document.getElementById('m-no').value        = d? d.no : siguienteNo();
  document.getElementById('m-clave').value     = d? d.clave : '';
  document.getElementById('m-nombre').value    = d? d.nombre : '';
  document.getElementById('m-centro').value    = d? d.centro : '';
  document.getElementById('m-factura').value   = d? d.factura : '';
  document.getElementById('m-proveedor').value = d? d.proveedor : '';
  document.getElementById('m-monto').value     = d? d.monto : '';
  document.getElementById('m-cuotas').value    = d? String(d.cuotas) : '12';
  document.getElementById('m-inicio').value    = d? d.mesInicio : '';
  document.getElementById('m-abono').value     = d? d.abono : 0;
  document.getElementById('m-estado').value    = d? d.estado : 'Activo';
  document.getElementById('m-obs').value       = d? d.obs : '';

  // fecha de factura dd/mm/aaaa -> yyyy-mm-dd
  var fv = '';
  if(d && d.fechaFactura){
    var m = d.fechaFactura.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m) fv = m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  document.getElementById('m-fecha').value = fv;

  previewCalc();
  document.getElementById('modal-doc').className = 'modal on';
}
function guardar(){
  var monto  = num(document.getElementById('m-monto').value);
  var clave  = document.getElementById('m-clave').value.trim();
  var nombre = document.getElementById('m-nombre').value.trim();
  var inicio = document.getElementById('m-inicio').value;
  if(!clave && !nombre){ toast('Ingrese la clave o el nombre del empleado','err'); return; }
  if(monto<=0){ toast('Ingrese un monto valido','err'); return; }
  if(!inicio){ toast('Seleccione el mes de inicio de descuento','err'); return; }

  var fIso = document.getElementById('m-fecha').value;
  var fTxt = '';
  if(fIso){ var p=fIso.split('-'); fTxt = p[2]+'/'+p[1]+'/'+p[0]; }

  var orig = null;
  if(editandoFila!==null) for(var i=0;i<DATOS.length;i++) if(DATOS[i].fila===editandoFila) orig = DATOS[i];

  var d = {
    no:            document.getElementById('m-no').value.trim(),
    clave:         clave,
    nombre:        nombre,
    centro:        document.getElementById('m-centro').value.trim(),
    factura:       document.getElementById('m-factura').value.trim(),
    proveedor:     document.getElementById('m-proveedor').value.trim(),
    fechaFactura:  fTxt,
    monto:         monto,
    cuotas:        parseInt(document.getElementById('m-cuotas').value,10)||12,
    mesInicio:     inicio,
    abono:         num(document.getElementById('m-abono').value),
    estado:        document.getElementById('m-estado').value,
    obs:           document.getElementById('m-obs').value.trim(),
    anio:          orig && orig.anio ? orig.anio : inicio.substring(0,4),
    registradoPor: orig && orig.registradoPor ? orig.registradoPor : (usuarioActual?usuarioActual.nombre:'')
  };

  cargando(true);
  var payload = (editandoFila!==null)
    ? {accion:'editar',  tipo:HOJA, fila:editandoFila, cols:objACols(d)}
    : {accion:'agregar', tipo:HOJA, cols:objACols(d)};

  apiPost(payload, function(ok, j, msg){
    cargando(false);
    if(ok){
      cerrar('modal-doc');
      toast(editandoFila!==null? 'Financiamiento actualizado' : 'Financiamiento registrado','ok');
      registrarBitacora(editandoFila!==null?'Edito':'Agrego', d.no,
        (d.clave||d.nombre)+' - '+L(d.monto)+' en '+d.cuotas+' cuotas desde '+d.mesInicio);
      setTimeout(function(){ cargarDatos(true); }, 1200);
      editandoFila = null;
    }else{
      toast('NO SE GUARDO: '+(msg||'error desconocido'),'err');
      console.warn('Payload enviado:', payload);
    }
  });
}
function eliminar(fila){
  var d = null;
  for(var i=0;i<DATOS.length;i++) if(DATOS[i].fila===fila) d = DATOS[i];
  if(!d) return;
  if(!confirm('Eliminar el financiamiento No. '+d.no+' de '+(d.nombre||d.clave)+'?')) return;
  cargando(true);
  apiPost({accion:'eliminar', tipo:HOJA, fila:fila}, function(ok){
    cargando(false);
    if(ok){
      toast('Registro eliminado','ok');
      registrarBitacora('Elimino', d.no, (d.clave||d.nombre)+' - '+L(d.monto));
      setTimeout(function(){ cargarDatos(true); }, 1200);
    }else toast('No se pudo eliminar','err');
  });
}

/* ==================================================================
   DIAGNOSTICO DE CONEXION
================================================================== */
function diagnostico(){
  cargando(true);
  apiGet(HOJA, function(r){
    var t = 'DIAGNOSTICO DE CONEXION\n';
    t += '========================================\n';
    t += 'URL del script:\n' + API + '\n\n';
    t += 'Hoja destino: "' + HOJA + '"\n\n';
    if(r===null){
      t += '1) LECTURA: FALLO — el script no respondio.\n';
      t += '   Causas: la URL /exec es incorrecta, el despliegue no esta\n';
      t += '   como "Cualquier persona", o no hay internet.\n';
    }else if(r && r.datos){
      t += '1) LECTURA: OK — ' + r.datos.length + ' filas leidas de la hoja.\n';
    }else{
      t += '1) LECTURA: respuesta inesperada:\n   ' + JSON.stringify(r).substring(0,300) + '\n';
    }
    t += '\n2) ESCRITURA: enviando fila de prueba...\n';

    apiPost({accion:'agregar', tipo:HOJA,
      cols:['TEST','TEST','** PRUEBA DE CONEXION - BORRAR **','','','','',0,1,hoyYm(),0,'Suspendido',
            'Fila generada por el diagnostico', String(new Date().getFullYear()), 'diagnostico']},
      function(ok, j, msg){
        cargando(false);
        t += ok
          ? '   ESCRITURA: OK — se envio la fila. Revise la hoja "'+HOJA+'":\n'+
            '   si aparece la fila TEST, el guardado funciona (puede borrarla).\n'+
            '   Si NO aparece, la hoja "'+HOJA+'" no existe o el script no\n'+
            '   reconoce ese nombre de tipo.\n'
          : '   ESCRITURA: FALLO — ' + (msg||'error desconocido') + '\n';
        t += '\n----------------------------------------\n';
        t += 'RESPUESTA CRUDA DEL SERVIDOR:\n' + String(ULTIMA_RESPUESTA).substring(0,600);
        alert(t);
        cargarDatos(true);
      });
  });
}

      '<td><b>'+esc(u.id)+'</b></td>'+
      '<td>'+esc(u.nombre)+'</td>'+
      '<td><span id="pw-'+i+'" style="letter-spacing:2px">&bull;&bull;&bull;&bull;&bull;&bull;</span> '+
        '<button class="icon-btn" title="Mostrar/ocultar" onclick="verPass('+i+')">&#x1F441;</button></td>'+

              ? '<span class="badge b-act">Administrador</span>'
              : '<span class="badge b-liq">Usuario</span>')+
        (u.protegido? ' <span class="badge b-sus">Protegido</span>':'')+'</td>'+
      '<td style="white-space:nowrap">'+
        '<button class="icon-btn" title="Editar" onclick="editarUsuario('+i+')">&#x270F;</button>'+

       'Los usuarios se guardan en la hoja <b>'+HOJA_USU+'</b> del Google Sheets. '+
       'El usuario <b>admin</b> est&aacute; protegido y no se puede eliminar.</div>';
  document.getElementById('usu-lista').innerHTML = h;
}
function verPass(i){
  var el = document.getElementById('pw-'+i);
  if(el.getAttribute('data-on')==='1'){
    el.textContent = '\u2022\u2022\u2022\u2022\u2022\u2022'; el.setAttribute('data-on','0');
  }else{
    el.textContent = USUARIOS[i].pass || '(sin clave)'; el.setAttribute('data-on','1');
  }
}
function limpiarFormUsuario(){
  editandoUsuario = null;
  document.getElementById('u-id').value = '';
  document.getElementById('u-id').disabled = false;
  document.getElementById('u-nombre').value = '';
  document.getElementById('u-pass').value = '';
  document.getElementById('u-rolsel').value = 'usuario';
  document.getElementById('usu-form-titulo').textContent = 'Agregar nuevo usuario';
  document.getElementById('u-btn-guardar').textContent = 'Agregar usuario';
}
function editarUsuario(i){
  var u = USUARIOS[i];
  editandoUsuario = i;
  document.getElementById('u-id').value = u.id;
  document.getElementById('u-id').disabled = true;
  document.getElementById('u-nombre').value = u.nombre;
  document.getElementById('u-pass').value = u.pass;
  document.getElementById('u-rolsel').value = u.rol==='admin'?'admin':'usuario';
  document.getElementById('usu-form-titulo').textContent = 'Editando: '+u.nombre;
  document.getElementById('u-btn-guardar').textContent = 'Guardar cambios';
}
function guardarUsuario(){
  var id  = document.getElementById('u-id').value.trim().toLowerCase();
  var nom = document.getElementById('u-nombre').value.trim();
  var pw  = document.getElementById('u-pass').value.trim();
  var rol = document.getElementById('u-rolsel').value;

  if(!id){ toast('Ingrese el usuario de login','err'); return; }
  if(!/^[a-z0-9._-]+$/.test(id)){ toast('El usuario solo admite letras, numeros, punto, guion o guion bajo','err'); return; }
  if(!nom){ toast('Ingrese el nombre completo','err'); return; }
  if(pw.length<4){ toast('La contrasena debe tener al menos 4 caracteres','err'); return; }

  if(editandoUsuario===null){
    for(var i=0;i<USUARIOS.length;i++){
      if(USUARIOS[i].id===id){ toast('Ya existe un usuario con ese login','err'); return; }
    }
    USUARIOS.push({id:id, nombre:nom, pass:pw, rol:rol, protegido:false});
  }else{
    var u = USUARIOS[editandoUsuario];
    u.nombre = nom; u.pass = pw;
    if(!u.protegido) u.rol = rol;
    if(usuarioActual && usuarioActual.id===u.id){
      usuarioActual = u;
      document.getElementById('u-nom').textContent = u.nombre;
      document.getElementById('u-ini').textContent = u.nombre.substring(0,2).toUpperCase();
    }
  }

  var accion = editandoUsuario===null? 'Agrego usuario' : 'Edito usuario';
  cargando(true);
  guardarUsuariosEnSheets(function(ok){
    cargando(false);
    if(ok){
      toast(editandoUsuario===null? 'Usuario agregado' : 'Usuario actualizado','ok');
      registrarBitacora(accion, '', id+' ('+rol+')');
    }else{
      toast('Guardado local, pero no se pudo sincronizar con Sheets','err');
    }
    limpiarFormUsuario();
    pintarUsuarios();
    poblarLogin();
  });
}
function eliminarUsuario(i){
  var u = USUARIOS[i];
  if(u.protegido){ toast('Este usuario esta protegido','err'); return; }
  if(usuarioActual && usuarioActual.id===u.id){ toast('No puede eliminar el usuario con el que inicio sesion','err'); return; }
  if(!confirm('Eliminar al usuario "'+u.nombre+'" ('+u.id+')?')) return;
  USUARIOS.splice(i,1);
  cargando(true);
  guardarUsuariosEnSheets(function(ok){
    cargando(false);
    if(ok){ toast('Usuario eliminado','ok'); registrarBitacora('Elimino usuario','',u.id); }
    else toast('Eliminado local, pero no se pudo sincronizar con Sheets','err');
    limpiarFormUsuario();
    pintarUsuarios();
    poblarLogin();
  });
}

/* ==================================================================
   EXPORTAR CSV
================================================================== */
function exportar(){
  var lista = filtrar(), corte = corteYm();
  var rows = [['No.','Clave','Empleado','Centro','Factura','Proveedor','Fecha factura',
               'Monto total','Cuotas','Cuota mensual','Inicio','Fin','Pagadas','Pendientes',
               'Abonado','Saldo','Cuota '+ymLabel(corte),'Estado','Observaciones']];
  for(var i=0;i<lista.length;i++){
    var d=lista[i], c=d._c;
    rows.push([d.no,d.clave,d.nombre,d.centro,d.factura,d.proveedor,d.fechaFactura,
               d.monto.toFixed(2), d.cuotas, c.base.toFixed(2), ymLabel(d.mesInicio), ymLabel(c.fin),
               c.pagadas, c.pend, c.abonado.toFixed(2), c.saldo.toFixed(2),
               c.cuotaMes.toFixed(2), c.estadoCalc, d.obs]);
  }
  var csv = rows.map(function(r){
    return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Financiamiento_DBS_'+corte+'.csv';
  a.click();
  toast('Archivo CSV generado','ok');
}
