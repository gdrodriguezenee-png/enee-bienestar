<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal DBS — redirigiendo</title>
<!-- Este era el portal anterior. Ahora manda al nuevo para que los enlaces
     y favoritos que ya tenia la gente sigan funcionando. -->
<meta http-equiv="refresh" content="2; url=index.html">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:'Barlow',system-ui,sans-serif;color:#1a2a3a;
       background:linear-gradient(135deg,#002247 0%,#003366 45%,#00538f 100%)}
  .caja{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:36px 32px;text-align:center;
        box-shadow:0 20px 55px rgba(0,20,60,.35)}
  .logo{width:60px;height:60px;margin:0 auto 14px;border-radius:15px;background:#f0a500;color:#003366;
        display:flex;align-items:center;justify-content:center;
        font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:25px;text-transform:uppercase;
     letter-spacing:.5px;color:#003366;margin:0 0 8px}
  p{margin:0 0 6px;color:#55677a;font-size:15px;line-height:1.5}
  a.btn{display:inline-block;margin-top:18px;background:#003366;color:#fff;text-decoration:none;
        font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;
        letter-spacing:.5px;padding:12px 24px;border-radius:9px}
  a.btn:hover{background:#005599}
  .barra{height:4px;background:#e8f0f8;border-radius:3px;overflow:hidden;margin-top:20px}
  .barra i{display:block;height:100%;width:0;background:#f0a500;animation:carga 2s linear forwards}
  @keyframes carga{to{width:100%}}
</style>
</head>
<body>
  <div class="caja">
    <div class="logo">DBS</div>
    <h1>El portal se mud&oacute;</h1>
    <p>Ahora hay un solo acceso para todos los sistemas del departamento.</p>
    <p>Te estamos llevando al portal nuevo&hellip;</p>
    <div class="barra"><i></i></div>
    <a class="btn" href="index.html">Ir ahora</a>
    <p style="margin-top:16px;font-size:13px;color:#8899aa">
      Actualiza tu favorito a la direcci&oacute;n del portal (sin nombre de archivo).
    </p>
  </div>
  <script>setTimeout(function(){ location.replace('index.html'); }, 1800);</script>
</body>
</html>
